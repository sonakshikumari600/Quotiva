<!-- This is the splash screen. It shows for 3 seconds and then takes the user to the home page. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quotiva</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<!-- Use the lavender theme by default until the saved theme is loaded -->
<body data-theme="lavender">

  <div class="splash-container">

    <!-- App logo icon -->
    <div class="logo-circle">
      <div class="cat">🐱</div>
    </div>

    <!-- App name -->
    <h1 class="title">Quotiva</h1>

    <!-- Short tagline shown below the app name -->
    <div class="subtitle">
      Generate quotes. Get inspired. ✨
    </div>

    <!-- Three bouncing dots shown while the app is loading -->
    <div class="dots">
      <span></span><span></span><span></span>
    </div>

  </div>

  <!-- Wait 3 seconds then go to the home page -->
  <script>
    setTimeout(() => {
      window.location.href = "index.html";
    }, 3000);
  </script>

</body>
</html>
